spring.application.name=arohak-hotel-booking
server.port=8080

# Embedded H2 database: data is kept in memory while the application runs.
spring.datasource.url=jdbc:h2:mem:arohak_hotel;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-value-for-production-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
